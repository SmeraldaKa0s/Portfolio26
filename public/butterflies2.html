<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Mariposas ASCII II</title>
<style>
	:root { --bg:#0a0a0a; --fg:#f5f5f3; --muted:#8a8a8a; --line:#222; }
	* { box-sizing: border-box; }
	body { margin:0; background:var(--bg); color:var(--fg); font-family: ui-monospace, Menlo, Consolas, monospace; }
	header { display:flex; flex-wrap:wrap; gap:16px 32px; align-items:center; justify-content:space-between; padding:20px; border-bottom:1px dashed var(--line); }
	h1 { margin:0; font-size:14px; font-weight:400; letter-spacing:.04em; }
	h1 span { color:var(--muted); }
	label { font-size:12px; color:var(--muted); display:flex; gap:8px; align-items:center; }
	input[type=range] { accent-color:#f5f5f3; }
	.grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(340px,1fr)); }
	.card { border-right:1px dashed var(--line); border-bottom:1px dashed var(--line); position:relative; }
	.card canvas { display:block; width:100%; height:260px; }
	.meta { padding:10px 16px 14px; border-top:1px dashed var(--line); font-size:12px; }
	.meta b { font-weight:400; }
	.meta b::before { content:attr(data-n) "  "; color:var(--muted); }
	.meta p { margin:4px 0 0; color:var(--muted); line-height:1.4; }
</style>

<script>
// ============ utilidades ============
const clamp = (x, a, b) => Math.max(a, Math.min(b, x));
const frac = x => x - Math.floor(x);
const hash = (a, b) => frac(Math.sin(a * 127.1 + b * 311.7) * 43758.5453);
const smooth = e => e * e * (3 - 2 * e);
function mulberry(seed) { return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

// spline Catmull-Rom cerrada
function catmull(ctrl, seg = 12) {
	const n = ctrl.length, out = [];
	for (let i = 0; i < n; i++) {
		const p0 = ctrl[(i - 1 + n) % n], p1 = ctrl[i], p2 = ctrl[(i + 1) % n], p3 = ctrl[(i + 2) % n];
		for (let j = 0; j < seg; j++) {
			const t = j / seg, t2 = t * t, t3 = t2 * t;
			out.push([0, 1].map(k => .5 * (2 * p1[k] + (-p0[k] + p2[k]) * t + (2 * p0[k] - 5 * p1[k] + 4 * p2[k] - p3[k]) * t2 + (-p0[k] + 3 * p1[k] - 3 * p2[k] + p3[k]) * t3)));
		}
	}
	return out;
}
function bezPts([a, c, b], n = 18) {
	const out = [];
	for (let i = 0; i <= n; i++) { const t = i / n; out.push([(1 - t) ** 2 * a[0] + 2 * (1 - t) * t * c[0] + t * t * b[0], (1 - t) ** 2 * a[1] + 2 * (1 - t) * t * c[1] + t * t * b[1]]); }
	return out;
}
function cumLen(pts, closed) {
	const n = pts.length, m = closed ? n : n - 1, cum = [0];
	for (let i = 0; i < m; i++) { const a = pts[i], b = pts[(i + 1) % n]; cum.push(cum[i] + Math.hypot(b[0] - a[0], b[1] - a[1])); }
	const L = cum[cum.length - 1]; return cum.map(x => x / L);
}
// distancia al polígono/polilínea -> [d, ángulo tangente, parámetro 0..1]
function nearest(pts, cum, closed, x, y) {
	let bd = 1e9, ba = 0, bs = 0; const n = pts.length, m = closed ? n : n - 1;
	for (let i = 0; i < m; i++) {
		const a = pts[i], b = pts[(i + 1) % n], dx = b[0] - a[0], dy = b[1] - a[1], l2 = dx * dx + dy * dy || 1e-9;
		let t = ((x - a[0]) * dx + (y - a[1]) * dy) / l2; t = t < 0 ? 0 : t > 1 ? 1 : t;
		const ex = a[0] + t * dx - x, ey = a[1] + t * dy - y, d = ex * ex + ey * ey;
		if (d < bd) { bd = d; ba = Math.atan2(dy, dx); bs = cum[i] + (cum[i + 1] - cum[i]) * t; }
	}
	return [Math.sqrt(bd), ba, bs];
}
function inside(pts, x, y) {
	let c = false;
	for (let i = 0, j = pts.length - 1; i < pts.length; j = i++) {
		const a = pts[i], b = pts[j];
		if ((a[1] > y) !== (b[1] > y) && x < (b[0] - a[0]) * (y - a[1]) / (b[1] - a[1]) + a[0]) c = !c;
	}
	return c;
}

// ============ siluetas (ala derecha; u hacia afuera, v hacia arriba; raíz ≈ tórax) ============
const SHAPES = {

		h: [[.05, .06], [.3, .1], [.55, .06], [.72, -.08], [.78, -.28], [.68, -.5], [.5, -.66], [.3, -.7], [.15, -.6], [.06, -.36], [.03, -.12]],
	},
	longwing: {

		h: [[.05, .06], [.36, .08], [.6, -.02], [.68, -.18], [.58, -.36], [.42, -.48], [.36, -.66], [.38, -.88], [.31, -.92], [.25, -.7], [.18, -.54], [.07, -.34], [.03, -.12]],
	},
	cola: {
		f: [[.04, .17], [.3, .44], [.6, .68], [.86, .84], [.96, .8], [.9, .56], [.76, .3], [.56, .1], [.3, .03], [.1, .03]],
		h: [[.05, .06], [.38, .1], [.6, -.04], [.68, -.24], [.6, -.42], [.5, -.52], [.46, -.7], [.46, -.96], [.37, -.98], [.34, -.72], [.28, -.62], [.15, -.56], [.06, -.34], [.03, -.12]],
	},
	redonda: {
		f: [[.04, .17], [.26, .46], [.55, .7], [.82, .78], [.97, .66], [.93, .4], [.76, .16], [.46, .03], [.12, .03]],
		h: [[.05, .06], [.4, .08], [.68, -.04], [.8, -.26], [.72, -.5], [.5, -.66], [.26, -.64], [.1, -.42], [.03, -.14]],
	},
	deco: {
		poly: true,
		f: [[.04, .16], [.9, .84], [1.02, .6], [.66, .06], [.08, .02]],
		h: [[.05, .06], [.62, .04], [.74, -.3], [.44, -.7], [.22, -.7], [.05, -.32]],
	},
	ornitoptera: {
		f: [[.04, .17], [.36, .46], [.74, .7], [1.04, .82], [1.14, .78], [1.06, .62], [.84, .4], [.56, .18], [.28, .05], [.1, .03]],
		h: [[.05, .06], [.36, .08], [.58, 0], [.68, -.14], [.66, -.32], [.56, -.5], [.4, -.62], [.24, -.6], [.1, -.46], [.03, -.16]],
	},
};
const VEIN_ANG = { f: [6, 18, 30, 41, 52, 63], h: [-4, -22, -40, -57, -72, -86] };
const ROOT = { f: [.06, .08], h: [.06, .02] };

// ============ estilos ============
// shade(I) -> [char | 'L' (línea orientada), brillo 0..1, índice de color, ángulo de línea]
const T = (I, a) => .5 * (Math.abs(Math.sin(a)) * I.cw + Math.abs(Math.cos(a)) * I.ch);
const STYLES = [
	{
		name: 'Monarca', shape: 'monarca',
		desc: 'Clásica: paneles ámbar, venas oscuras marcadas y borde negro con perlas blancas. Vuelo: aleteo-aleteo-planeo, largas planeadas.',
		pal: ['#e9973f', '#7a6656', '#f5f5f3'], lines: ['-', '\\', '|', '/'], trail: ' .·:',
		body: { h: '@', t: '#', a: '|', c: '•', col: 1 },
		fl: { freq: 5.2, down: .36, up: 72, dn: -26, kmin: .2, g: 2.2, speed: 48, glide: .2, gd: [.7, 1.6], ga: 4, sink: .12, turn: .5, bob: 5, burst: .12 },
		shade(I) {
			if (!I.inn) return null;
			const e = T(I, I.ta);
			if (I.sd < e * 1.05) return frac(I.s * 22) < .3 ? ['•', 1, 2] : ['#', .95, 1];
			if (I.dv < T(I, I.va) * .4) return ['L', .9, 1, I.va];
			return [I.rr > .55 ? '=' : I.rr > .3 ? '+' : '*', 1, 0];
		},
	},
	{
		name: 'Art Nouveau', shape: 'longwing',
		desc: 'Línea de látigo: contorno continuo, volutas internas que acaban en espiral, colas largas. Vuelo: lento y sinuoso, planeos largos.',
		pal: ['#f5f5f3', '#d8c08a'], lines: ['~', '\\', '|', '/'], trail: ' .·~',
		body: { h: 'o', t: '§', a: '¦', c: '@', col: 1 },
		strokes: { f: [[[.16, .12], [.62, .22], [.8, .5]]], h: [[[.12, -.04], [.46, -.06], [.4, -.4]]] },
		marks: [{ w: 'f', u: .79, v: .52, ch: '@', col: 1, both: 1 }, { w: 'h', u: .38, v: -.43, ch: '@', col: 1, both: 1 }],
		fl: { freq: 3.2, down: .4, up: 80, dn: -20, kmin: .1, g: 1.4, speed: 36, glide: .35, gd: [1, 2.2], ga: 6, sink: .1, turn: .9, bob: 6, burst: .08 },
		shade(I) {
			if (!I.inn) return null;
			if (I.sd < T(I, I.ta) * .75) return ['L', 1, 0, I.ta];
			if (I.ds < T(I, I.sa) * .5) return ['L', .85, 1, I.sa];
			if (I.wing === 'f' && I.rr > .78 && I.s > .3 && I.s < .62 && I.sd < T(I, I.ta) * 1.8 && frac(I.s * 30) < .4) return ['·', .6, 1];
			return null;
		},
	},
	{
		name: 'Vitral', shape: 'redonda',
		desc: 'Celdas de cristal entre las venas de plomo, cada una con su familia de glifos y su color. Vuelo: majestuoso y estable.',
		pal: ['#9a9a96', '#6c6c69', '#c96b6b', '#6b8fd0', '#d8b25e', '#6bb38a', '#a07cc9'], lines: ['─', '\\', '│', '/'], trail: ' .·',
		body: { h: 'O', t: '█', a: '║', c: 'o', col: 0 },
		fl: { freq: 4.4, down: .36, up: 74, dn: -24, kmin: .18, g: 1.9, speed: 40, glide: .14, gd: [.6, 1.2], ga: 5, sink: .12, turn: .4, bob: 5, burst: .08 },
		shade(I) {
			if (!I.inn) return null;
			if (I.sd < T(I, I.ta) * .75) return ['L', 1, 0, I.ta];
			if (I.dv < T(I, I.va) * .45) return ['L', .8, 1, I.va];
			const R = I.r + I.sd, band = I.rr < .52 ? 0 : 1;
			if (Math.abs(I.rr - .52) * R < I.ch * .32) return ['L', .8, 1, I.th + Math.PI / 2];
			const GL = '%#&8$@*o=+X';
			const id = I.cell * 2 + band + (I.wing === 'h' ? 5 : 0);
			return [GL[id % GL.length], .95, 2 + (id * 3) % 5];
		},
	},
	{
		name: 'Puntillismo', shape: 'redonda',
		desc: 'Estampado de puntos ( . · • ): más densos en bordes, base y ocelos. Vuelo: nervioso, aleteo rapidísimo, saltitos.',
		pal: ['#9fc0f0', '#f5f5f3'], lines: ['-', '\\', '|', '/'], trail: ' .·',
		body: { h: '•', t: '•', a: ':', c: '•', col: 1 },
		fl: { freq: 10, down: .32, up: 70, dn: -34, kmin: .24, g: 3.4, speed: 58, glide: .05, gd: [.2, .45], ga: 2, sink: .2, turn: 2.4, bob: 3, burst: .2, irr: 1.2 },
		shade(I) {
			if (!I.inn) return null;
			let d = .45 + 1.2 * Math.exp(-I.sd / .09) + .6 * Math.max(0, 1 - I.rr * 2.4);
			const sp = I.wing === 'f' ? [.62, .5, .11] : [.42, -.38, .13];
			const dd = Math.hypot(I.u - sp[0], I.v - sp[1]);
			if (dd < sp[2] * .45) d = .06; else if (dd < sp[2]) d = 1.1;
			if (I.h > d) return null;
			return [I.sd < .06 || I.h2 > .62 ? '•' : I.h2 < .3 ? '.' : '·', .55 + .45 * Math.min(1, d), dd < sp[2] || I.h2 > .9 ? 1 : 0];
		},
	},
	{
		name: 'Grabado', shape: 'cola',
		desc: 'Macaón en aguafuerte: contorno de buril, rayado / y contra-rayado x para las sombras. Vuelo: batidas potentes y arcos amplios planeando.',
		pal: ['#eadfc8', '#b8a888'], lines: ['_', '\\', '|', '/'], trail: ' .·',
		body: { h: 'o', t: '#', a: 'H', c: '°', col: 0 },
		marks: [{ w: 'h', u: .34, v: -.5, ch: '◉', col: 0, both: 1 }],
		fl: { freq: 4, down: .38, up: 76, dn: -22, kmin: .16, g: 1.8, speed: 70, glide: .3, gd: [.8, 1.8], ga: 3, sink: .1, turn: .25, bob: 5, burst: .1 },
		shade(I) {
			if (!I.inn) return null;
			if (I.sd < T(I, I.ta) * .75) return ['L', 1, 0, I.ta];
			if (I.dv < T(I, I.va) * .38) return ['L', .75, 1, I.va];
			let t = .15;
			if (I.rr > .74) t = .9; else if (I.rr < .26) t = .62;
			if (I.wing === 'f' && frac(I.u * 3.2 + I.v * 1.6) < .32) t = Math.max(t, .72);
			const ci = Math.floor(I.u / I.cw), ri = Math.floor(I.v / I.ch);
			if (t < .3) return (ci + ri) % 3 === 0 ? ['/', .45, 1] : null;
			if (t < .7) return ['/', .7, 1];
			if (t < .85) return ['x', .8, 0];
			return ['#', .85, 0];
		},
	},
	{
		name: 'Ukiyo-e', shape: 'longwing',
		desc: 'Tinta sumi: pocas pinceladas que engordan y se secan, aguada leve, cuerpo bermellón. Vuelo: hoja que cae, alas que se cierran del todo.',
		pal: ['#f2efe8', '#7d7a74', '#e0563a'], lines: ['-', '\\', '|', '/'], trail: ' .',
		body: { h: '●', t: '●', a: '|', c: '·', col: 2 },
		marks: [{ w: 'f', u: .8, v: .62, ch: '•', col: 0, both: 1 }, { w: 'f', u: .7, v: .58, ch: '·', col: 0, both: 1 }],
		fl: { freq: 2.6, down: .45, up: 86, dn: -18, kmin: .05, g: 1.1, speed: 30, glide: .4, gd: [1.1, 2.4], ga: 10, sink: .16, turn: 1.1, bob: 7, burst: .06 },
		shade(I) {
			if (!I.inn) return null;
			let p = 0;
			if (I.wing === 'f') {
				if (I.s < .44) p = Math.min(1, I.s / .04) * (1 - (I.s / .44) * .45);
				else if (I.s < .7) p = .3 + .08 * Math.sin(I.s * 40);
			} else if (I.s > .08 && I.s < .5) p = .22 + .3 * Math.sin(Math.PI * (I.s - .08) / .42);
			const w = T(I, I.ta) * (.45 + 1.1 * p);
			if (p > 0 && I.sd < w) {
				if (I.h < .25 * (1 - p)) return ['·', .45, 0];
				return p > .78 ? ['#', 1, 0] : ['L', .6 + .4 * p, 0, I.ta];
			}
			if (I.wing === 'f' && I.vi === 2 && I.vs < .75 && I.dv < T(I, I.va) * .4) return ['L', .55, 1, I.va];
			if (I.rr < .32 && I.h < .22) return ['.', .4, 1];
			return null;
		},
	},
	{
		name: 'Art Déco', shape: 'deco',
		desc: 'Geometría simétrica: alas facetadas, doble línea dorada, abanico de rayos y arco escalonado. Vuelo: preciso, tramos rectos y giros secos.',
		pal: ['#f5f5f3', '#d9b56a', '#8a7448'], lines: ['═', '╲', '║', '╱'], trail: ' ·',
		body: { h: '◆', t: '█', a: '║', c: '◆', col: 1 },
		fl: { freq: 6, down: .34, up: 70, dn: -26, kmin: .2, g: 2.4, speed: 62, glide: .14, gd: [.6, .6], ga: 0, sink: .1, turn: 0, jump: 1.3, bob: 4, burst: .04 },
		shade(I) {
			if (!I.inn) return null;
			if (I.sd < T(I, I.ta) * .75) return ['L', 1, 1, I.ta];
			if (I.dv < T(I, I.va) * .42) return ['L', .75, 2, I.va];
			const R = I.r + I.sd;
			if (Math.abs(I.rr - .58) * R < I.ch * .32) return ['L', .85, 1, I.th + Math.PI / 2];
			if (I.rr > .58) return [I.cell % 2 ? '▲' : '=', .6, I.cell % 2 ? 1 : 2];
			return I.cell % 2 ? [':', .4, 2] : null;
		},

	{
		name: 'Píxel', shape: 'redonda',
		desc: 'Sprite de terminal retro (█▓▒░), fósforo verde, animación en 3 cuadros. Vuelo: a saltos de cuadrícula, como un videojuego de 8 bits.',
		pal: ['#8ef59b', '#3f8a4a'], lines: ['▒', '▒', '▒', '▒'], trail: ' ░',
		body: { h: '█', t: '█', a: '█', c: '▀', col: 0 },
		fl: { freq: 6.5, down: .34, up: 74, dn: -26, kmin: .2, g: 2.4, speed: 52, glide: .12, gd: [.4, .9], ga: 0, sink: .14, turn: 1, bob: 6, burst: .14, quant: 1 },
		shade(I) {
			if (!I.inn) return null;
			if (I.sd < T(I, I.ta) * .95) return ['█', 1, 0];
			if (I.dv < T(I, I.va) * .45) return ['░', .7, 1];
			if (I.rr > .7) return ['▒', .85, 0];
			return ['▓', .9, 0];

	},
	{
		name: 'Lámina botánica', shape: 'ornitoptera',
		desc: 'Ilustración de naturalista: trazo fino, nervaduras, lúnulas, letras de referencia (a, b) y escala. Vuelo: calmo, se posa en el aire con alas abiertas.',
		pal: ['#efe6d2', '#9d9580', '#c9a46a'], lines: ['-', '\\', '|', '/'], trail: ' .',

		marks: [{ w: 'f', u: .62, v: .46, ch: 'a', col: 2 }, { w: 'h', u: .34, v: -.28, ch: 'b', col: 2 }],

		shade(I) {
			if (!I.inn) return null;
			if (I.sd < T(I, I.ta) * .75) return ['L', 1, 0, I.ta];
			if (I.dv < T(I, I.va) * .4) return ['L', .65, 1, I.va];
			if (I.wing === 'h' && I.rr > .66 && I.rr < .86 && frac(I.s * 9) < .42) return ['o', .85, 2];
			if (I.wing === 'f' && I.rr > .8 && I.h < .35) return ['.', .45, 1];
			return null;
		},
	},
	{
		name: 'Fantasma', shape: 'longwing',
		desc: 'Ala de cristal luminosa: bordes que brillan con halo y estela larga que se disuelve hacia arriba. Vuelo: flotante, lentísimo, casi no aletea.',
		pal: ['#c4ecff', '#7fb6d4'], lines: ['-', '\\', '|', '/'], trail: ' .·:',
		body: { h: '*', t: ':', a: '¦', c: '·', col: 0 },
		glow: .14, drift: 1, fadePow: .45,
		fl: { freq: 2.4, down: .42, up: 78, dn: -18, kmin: .12, g: .9, speed: 24, glide: .45, gd: [1.4, 3], ga: 6, sink: .1, turn: .7, bob: 8, burst: .05 },
		shade(I) {
			let b = I.inn ? Math.max(.16, Math.exp(-I.sd / .05)) : Math.exp(I.sd / .045) * .75;
			if (I.inn && I.dv < T(I, I.va) * .35) b = Math.max(b, .42);
			if (b < .1) return null;
			const R = ' .·:+*';
			return [R[Math.min(R.length - 1, 1 + Math.floor(b * (R.length - 1)))], b, b > .5 ? 0 : 1];
		},
	},
];

// ============ horneado de texturas de ala ============
const TX = { v0: -1.05, nu: 110, nv: 176, u1: 1.3, v1: 1.0 };
TX.du = TX.u1 / TX.nu; TX.dv = (TX.v1 - TX.v0) / TX.nv;

function prepWing(shape, w) {
	const ctrl = SHAPES[shape][w], poly = SHAPES[shape].poly;
	let pts;
	if (poly) { pts = []; for (let i = 0; i < ctrl.length; i++) { const a = ctrl[i], b = ctrl[(i + 1) % ctrl.length]; for (let j = 0; j < 8; j++) pts.push([a[0] + (b[0] - a[0]) * j / 8, a[1] + (b[1] - a[1]) * j / 8]); } }
	else pts = catmull(ctrl);
	const cum = cumLen(pts, true), R = ROOT[w];
	const veins = VEIN_ANG[w].map(deg => {
		const a = deg * Math.PI / 180; let best = null, br = 0;
		for (const p of pts) { const pa = Math.atan2(p[1] - R[1], p[0] - R[0]), r = Math.hypot(p[0] - R[0], p[1] - R[1]); if (Math.abs(pa - a) < .06 && r > br) { br = r; best = p; } }
		if (!best) return null;
		const e = [R[0] + (best[0] - R[0]) * .96, R[1] + (best[1] - R[1]) * .96];
		return { pts: [R, e], cum: [0, 1], ang: Math.atan2(e[1] - R[1], e[0] - R[0]) };
	}).filter(Boolean);
	let bx0 = 1e9, bx1 = -1e9, by0 = 1e9, by1 = -1e9;
	for (const p of pts) { bx0 = Math.min(bx0, p[0]); bx1 = Math.max(bx1, p[0]); by0 = Math.min(by0, p[1]); by1 = Math.max(by1, p[1]); }
	return { pts, cum, R, veins, bb: [bx0, bx1, by0, by1] };
}

function bake(st, w, cw, ch) {
	const W = st.geo[w], n = TX.nu * TX.nv, glow = st.glow || 0;
	const L = { ch: new Uint16Array(n), b: new Float32Array(n), col: new Uint8Array(n), ang: new Float32Array(n) };
	const strokes = ((st.strokes && st.strokes[w]) || []).map(s => { const p = bezPts(s); return { p, cum: cumLen(p, false) }; });
	const I = { cw, ch, wing: w };
	for (let iv = 0; iv < TX.nv; iv++) {
		const v = TX.v0 + (iv + .5) * TX.dv;
		if (v < W.bb[2] - glow || v > W.bb[3] + glow) continue;
		for (let iu = 0; iu < TX.nu; iu++) {
			const u = (iu + .5) * TX.du;
			if (u < W.bb[0] - glow || u > W.bb[1] + glow) continue;
			const inn = inside(W.pts, u, v);
			const [d, ta, s] = nearest(W.pts, W.cum, true, u, v);
			const sd = inn ? d : -d;
			if (!inn && d > glow) continue;
			let dv = 9, va = 0, vi = -1, vs = 0;
			for (let k = 0; k < W.veins.length; k++) { const V = W.veins[k], r = nearest(V.pts, V.cum, false, u, v); if (r[0] < dv) { dv = r[0]; va = r[1]; vi = k; vs = r[2]; } }
			let ds = 9, sa = 0;
			for (const S of strokes) { const r = nearest(S.p, S.cum, false, u, v); if (r[0] < ds) { ds = r[0]; sa = r[1]; } }
			const rx = u - W.R[0], ry = v - W.R[1], r = Math.hypot(rx, ry), th = Math.atan2(ry, rx);
			let cell = 0; for (const V of W.veins) if ((w === 'f' ? th > V.ang : th < V.ang)) cell++;
			I.u = u; I.v = v; I.inn = inn; I.sd = sd; I.s = s; I.ta = ta; I.dv = dv; I.va = va; I.vi = vi; I.vs = vs;
			I.ds = ds; I.sa = sa; I.r = r; I.th = th; I.cell = cell; I.rr = inn ? r / (r + sd) : 1;
			I.h = hash(iu, iv); I.h2 = hash(iv + 17.3, iu * 1.7);
			const res = st.shade(I);
			if (!res) continue;
			const i = iv * TX.nu + iu;
			L.ch[i] = res[0] === 'L' ? 1 : res[0].charCodeAt(0);
			L.b[i] = res[1]; L.col[i] = res[2] || 0; L.ang[i] = res[3] || 0;
		}
	}
	return L;
}

// ============ render ============
const FONT_PX = 7, CH = 7.6;
const FONT = `${FONT_PX}px ui-monospace, Menlo, Consolas, monospace`;
const sizeEl = document.getElementById('size'), trailEl = document.getElementById('trail');
const grid = document.getElementById('grid');
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches || /[?&]still\b/.test(location.search);
const mctx = document.createElement('canvas').getContext('2d'); mctx.font = FONT;
const CW = mctx.measureText('M').width || 4.8;

function bakeAll() {
	const S = +sizeEl.value;
	for (const st of STYLES) { st.tex = { f: bake(st, 'f', CW / S, CH / S), h: bake(st, 'h', CW / S, CH / S) }; }
}
for (const st of STYLES) st.geo = { f: prepWing(st.shape, 'f'), h: prepWing(st.shape, 'h') };
bakeAll();
sizeEl.addEventListener('change', () => { bakeAll(); if (reduce) cards.forEach(render); });
if (reduce) { sizeEl.addEventListener('input', () => cards.forEach(render)); trailEl.disabled = true; }

function lineChar(st, a) {
	let d = (a * 180 / Math.PI) % 180; if (d < 0) d += 180;
	const L = st.lines;
	return d < 24 || d >= 156 ? L[0] : d < 68 ? L[1] : d < 112 ? L[2] : L[3];
}

const ANT = [[.025, .27], [.08, .52], [.19, .74]];
const cards = STYLES.map((st, i) => {
	const el = document.createElement('div');
	el.className = 'card';
	el.innerHTML = `<canvas></canvas><div class="meta"><b data-n="${i + 11}">${st.name}</b><p>${st.desc}</p></div>`;
	grid.appendChild(el);
	const canvas = el.querySelector('canvas'), ctx = canvas.getContext('2d');
	const c = { st, canvas, ctx, W: 0, H: 0, cols: 0, rows: 0, rng: mulberry(1000 + i * 77), stamp: 0, lt: -1, drift: 0 };
	c.tb = new Float32Array(0);
	const resize = () => {
		const dpr = devicePixelRatio || 1;
		c.W = canvas.clientWidth; c.H = canvas.clientHeight;
		canvas.width = c.W * dpr; canvas.height = c.H * dpr;
		ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
		c.cols = Math.ceil(c.W / CW); c.rows = Math.ceil(c.H / CH);
		const n = c.cols * c.rows;
		c.tb = new Float32Array(n); c.tc = new Uint16Array(n); c.tk = new Uint8Array(n); c.tf = new Uint32Array(n);
		if (!c.s) c.s = initState(c);
		if (reduce) render(c);
	};
	new ResizeObserver(resize).observe(canvas);
	return c;
});

// ============ vuelo ============
function initState(c) {
	const r = c.rng;
	return { x: c.W * (.3 + .4 * r()), y: c.H * (.38 + .2 * r()), vx: 0, vy: 0, ph: r(), mode: 'flap', timer: 0, beats: 0,
		hd: r() < .5 ? 0 : Math.PI, hv: 0, lr: 1, rate: 1, tilt: 0, yoff: 0, ps: 1, roll: 0, kf: 1, kh: 1, jt: 0 };
}
function wingAng(f, ph) {
	ph = frac(ph);
	if (ph < f.down) return f.up + (f.dn - f.up) * smooth(ph / f.down);
	return f.dn + (f.up - f.dn) * smooth((ph - f.down) / (1 - f.down));
}
const angDiff = (a, b) => { let d = b - a; while (d > Math.PI) d -= 2 * Math.PI; while (d < -Math.PI) d += 2 * Math.PI; return d; };

function step(c, dt) {
	const s = c.s, f = c.st.fl, r = c.rng, W = c.W, H = c.H;
	if (!W) return;
	const S = +sizeEl.value, g = f.g * H, mx = Math.max(W * (f.box || .2), S * 1.5), cx = W / 2, cy = H * .47;
	// rumbo: deriva aleatoria + regreso al centro
	if (f.jump) {
		s.jt -= dt;
		if (s.jt <= 0) {
			s.jt = f.jump * (.7 + .6 * r());
			const toC = Math.atan2(cy - s.y, cx - s.x), choices = [];
			for (let k = 0; k < 8; k++) { const a = k * Math.PI / 4; if (Math.cos(angDiff(a, toC)) > -.2) choices.push(a); }
			const nh = choices[Math.floor(r() * choices.length)];
			s.hv = angDiff(s.hd, nh) * 2.5; s.hd = nh;
		}
		s.hv *= Math.exp(-6 * dt);
	} else {
		s.hv += (r() - .5) * f.turn * 30 * dt; s.hv *= Math.exp(-1.6 * dt);
		s.hd += s.hv * dt;
		const out = s.x < mx || s.x > W - mx || s.y < Math.max(H * .26, S * 1.2) || s.y > H * .74;
		if (out) { const toC = Math.atan2(cy - s.y, cx - s.x); s.hd += angDiff(s.hd, toC) * Math.min(1, 2.2 * dt); }
	}
	const thrust = f.speed * 1.6 / f.freq;
	if (s.mode === 'flap') {
		const dph = dt * f.freq * s.rate, old = s.ph;
		s.ph += dph;
		if (old < f.down) {   // golpe hacia abajo: sustentación + empuje
			const part = Math.min(dph, Math.max(0, f.down - old)) / f.down;
			s.vy -= s.lr * g / f.freq * part;
			s.vx += Math.cos(s.hd) * thrust * part;
			s.vy += Math.sin(s.hd) * thrust * .5 * part;
		}
		if (s.ph >= 1) {
			s.ph -= 1; s.beats++;
			s.lr = 1 + 2.2 * (s.y - cy) / H + (r() - .5) * (f.irr || .7);
			s.rate = 1 + (r() - .5) * .25;
			if (r() < f.burst) { s.lr += 1.1; s.rate = 1.35; }   // subida repentina
			const low = s.y > H * .7;
			if (!low && s.beats > 2 && r() < f.glide) { s.mode = 'glide'; s.timer = f.gd[0] + r() * (f.gd[1] - f.gd[0]); s.beats = 0; }
		}
	} else {
		s.timer -= dt;
		if (s.timer <= 0 || s.y > H * .72) { s.mode = 'flap'; s.ph = 0; s.lr = 1.4; }
	}
	s.vy += g * (s.mode === 'glide' ? f.sink : 1) * dt;
	s.vx *= Math.exp(-1.1 * dt); s.vy *= Math.exp(-2.6 * dt);
	s.x += s.vx * dt; s.y += s.vy * dt;
	const cxl = clamp(s.x, S * 1.1, W - S * 1.1); if (cxl !== s.x) { s.vx *= -.3; s.x = cxl; } s.y = clamp(s.y, Math.min(H * .45, S * 1.15), Math.max(H * .6, H - S * 1.05));

	// alas
	let aF, aH, ph2;
	if (s.mode === 'flap') {
		aF = wingAng(f, s.ph); aH = wingAng(f, s.ph - .05);
		ph2 = s.ph < f.down ? .5 * s.ph / f.down : .5 + .5 * (s.ph - f.down) / (1 - f.down);
	} else { aF = aH = f.ga + 2 * Math.sin(s.timer * 9); ph2 = .25; }
	const toR = Math.PI / 180;
	s.kf = Math.max(f.kmin, Math.cos(aF * toR)); s.kh = Math.max(f.kmin, Math.cos(aH * toR));
	const yo = s.mode === 'flap' ? f.bob * Math.cos(2 * Math.PI * ph2) : 0;
	s.yoff += (yo - s.yoff) * Math.min(1, dt * 18);
	const tt = clamp(s.vx / (f.speed + 1) * .22, -.3, .3) + (s.mode === 'flap' ? .03 * Math.sin(2 * Math.PI * ph2) : 0);
	s.tilt += (tt - s.tilt) * Math.min(1, dt * 4);
	s.roll += (clamp(s.hv * .12, -.35, .35) - s.roll) * Math.min(1, dt * 5);
	const pt = 1 - clamp(-s.vy / 420, -.08, .12) - (s.mode === 'flap' ? .04 * Math.sin(2 * Math.PI * ph2) : 0);
	s.ps += (pt - s.ps) * Math.min(1, dt * 8);
}

// ============ dibujo ============
function look(L, au, bv) {
	if (au < 0) return -1;
	const iu = (au / TX.du) | 0; if (iu >= TX.nu) return -1;
	const iv = ((bv - TX.v0) / TX.dv) | 0; if (iv < 0 || iv >= TX.nv) return -1;
	const i = iv * TX.nu + iu; return L.ch[i] ? i : -1;
}
function segDist(px, py, a, b) {
	const dx = b[0] - a[0], dy = b[1] - a[1], t = clamp(((px - a[0]) * dx + (py - a[1]) * dy) / (dx * dx + dy * dy), 0, 1);
	return Math.hypot(px - a[0] - t * dx, py - a[1] - t * dy);
}

function render(c) {
	const { st, ctx, s } = c;
	if (!c.W || !s) return;
	const f = st.fl, S = +sizeEl.value;
	let FADE = trailEl.value / 100; if (st.fadePow) FADE = Math.pow(FADE, st.fadePow);
	let X = s.x, Y = s.y + s.yoff, kF = s.kf, kH = s.kh, tilt = s.tilt, ps = s.ps, roll = s.roll;
	if (reduce) { X = c.W / 2; Y = c.H * .5; kF = kH = 1; tilt = 0; ps = 1; roll = 0; }
	if (f.quant) {
		X = Math.round(X / (2 * CW)) * 2 * CW; Y = Math.round(Y / (2 * CH)) * 2 * CH;
		const q = k => k > .78 ? 1 : k > .42 ? .56 : .2; kF = q(kF); kH = q(kH); tilt = 0; ps = 1; roll = 0;
	}
	const kfs = [kF * (1 - Math.max(0, -roll)), kF * (1 - Math.max(0, roll))], khs = [kH * (1 - Math.max(0, -roll)), kH * (1 - Math.max(0, roll))];
	const cos = Math.cos(tilt), sin = Math.sin(tilt);
	const { tb, tc, tk, tf } = c, cols = c.cols, rows = c.rows;

	for (let i = 0; i < tb.length; i++) tb[i] *= FADE;
	if (st.drift) {   // la estela fantasma sube y se deshace
		c.drift++;
		if (c.drift % 4 === 0) {
			for (let r = 0; r < rows - 1; r++) for (let q = 0; q < cols; q++) {
				const i = r * cols + q, j = i + cols; tb[i] = tb[j] * (c.rng() < .85 ? 1 : .3); tc[i] = tc[j]; tk[i] = tk[j];
			}
		}
	}
	const stamp = ++c.stamp;
	const cwN = CW / S, chN = CH / S, tex = st.tex;
	const reachX = S * 1.45, reachY = S * 1.3;
	const R = Math.max(reachX, reachY);
	const c0 = Math.max(0, Math.floor((X - R) / CW)), c1 = Math.min(cols - 1, Math.ceil((X + R) / CW));
	const r0 = Math.max(0, Math.floor((Y - R) / CH)), r1 = Math.min(rows - 1, Math.ceil((Y + R) / CH));
	const B = st.body;
	const put = (i, code, b, k) => { tb[i] = b; tc[i] = code; tk[i] = k; tf[i] = stamp; };
	const orient = (a, side, k) => {
		const tu = Math.cos(a) * side * k, tv = Math.sin(a) * ps;
		const bx = tu, by = -tv;
		return lineChar(st, Math.atan2(bx * sin + by * cos, bx * cos - by * sin));
	};
	for (let r = r0; r <= r1; r++) for (let q = c0; q <= c1; q++) {
		const x = (q + .5) * CW - X, y = (r + .5) * CH - Y;
		const xb = x * cos + y * sin, yb = -x * sin + y * cos;
		const bu = xb / S, bv = -yb / (S * ps), au = Math.abs(bu), side = bu < 0 ? -1 : 1, si = bu < 0 ? 0 : 1;
		const i = r * cols + q;
		// cuerpo
		const hw = cwN * .5;
		if ((bu / Math.max(.05, hw)) ** 2 + ((bv - .235) / .05) ** 2 < 1) { put(i, B.h.charCodeAt(0), 1, B.col); continue; }
		if ((bu / Math.max(.055, hw * 1.05)) ** 2 + ((bv - .1) / .12) ** 2 < 1) { put(i, B.t.charCodeAt(0), 1, B.col); continue; }
		if (bv < -.02 && bv > -.62 && au < Math.max(hw * .95, .05 * (1 - .6 * (-.02 - bv) / .6))) { put(i, B.a.charCodeAt(0), .95, B.col); continue; }
		// alas: anterior por encima de la posterior
		let L = tex.f, j = look(L, au / kfs[si], bv), k = kfs[si];
		if (j < 0) { L = tex.h; j = look(L, au / khs[si], bv); k = khs[si]; }
		if (j >= 0) {
			const code = L.ch[j] === 1 ? orient(L.ang[j], side, k).charCodeAt(0) : L.ch[j];
			put(i, code, L.b[j] * (.75 + .25 * k), L.col[j]);
			continue;
		}
		// antenas
		if (bv > .25 && bv < .82) {
			const e = ANT[2];
			if (Math.hypot(au - e[0], bv - e[1]) < Math.max(.035, hw * .9)) { put(i, B.c.charCodeAt(0), .95, B.col); continue; }
			for (let m = 0; m < 2; m++) {
				const a = ANT[m], b = ANT[m + 1], ang = Math.atan2(b[1] - a[1], b[0] - a[0]);
				if (segDist(au, bv, a, b) < .5 * (Math.abs(Math.sin(ang)) * cwN + Math.abs(Math.cos(ang)) * chN) * .72) {
					put(i, orient(ang, side, 1).charCodeAt(0), .8, B.col); break;
				}
			}
		}
	}
	// marcas en el espacio del ala (letras, ocelos, espirales)
	if (st.marks) for (const m of st.marks) {
		for (const side of m.both ? [-1, 1] : [1]) {
			const k = (m.w === 'f' ? kfs : khs)[side < 0 ? 0 : 1];
			if (k < .45) continue;
			const bx = side * m.u * k * S, by = -m.v * S * ps;
			const sx = X + bx * cos - by * sin, sy = Y + bx * sin + by * cos;
			const q = Math.floor(sx / CW), rr = Math.floor(sy / CH);
			if (q >= 0 && q < cols && rr >= 0 && rr < rows) put(rr * cols + q, m.ch.charCodeAt(0), 1, m.col);
		}
	}

	ctx.clearRect(0, 0, c.W, c.H);
	ctx.font = FONT; ctx.textBaseline = 'top';
	const tr = st.trail;
	let lastK = -1;
	for (let r = 0; r < rows; r++) for (let q = 0; q < cols; q++) {
		const i = r * cols + q, b = tb[i];
		if (b < .05) continue;
		let ch;
		if (tf[i] === stamp) ch = String.fromCharCode(tc[i]);
		else { if (b < (st.drift ? .08 : .24)) continue; ch = tr[Math.min(tr.length - 1, 1 + Math.max(0, Math.floor((b - .2) * (tr.length - 1) * 1.4)))]; if (ch === ' ') continue; }
		if (tk[i] !== lastK) { ctx.fillStyle = st.pal[tk[i]] || st.pal[0]; lastK = tk[i]; }
		ctx.globalAlpha = tf[i] === stamp ? clamp(.25 + b * .75, 0, 1) : b * (st.drift ? .8 : .5);
		ctx.fillText(ch, q * CW, r * CH);
	}
	ctx.globalAlpha = 1;
	if (st.caption) {
		ctx.fillStyle = '#6b6b6b';
		ctx.fillText(st.caption[0], 12, c.H - 18);
		const w = ctx.measureText(st.caption[1]).width;
		ctx.fillText(st.caption[1], c.W - w - 12, c.H - 18);
	}
}

function frame(now) {
	const t = now / 1000;
	for (const c of cards) {
		const dt = c.lt < 0 ? 0 : clamp(t - c.lt, 0, .05); c.lt = t;
		step(c, dt);
		render(c);
	}
	requestAnimationFrame(frame);
}
// ?sim=N (depuración): pre-simula N segundos a 60 fps y congela el cuadro
const simM = /[?&]sim=([\d.]+)/.exec(location.search);
if (simM) {
	setTimeout(() => { for (const c of cards) for (let k = 0; k < +simM[1] * 60; k++) { step(c, 1 / 60); render(c); } }, 300);
} else if (!reduce) requestAnimationFrame(frame);
</script>
</body>
</html>
